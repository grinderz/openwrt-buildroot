# CORS proxy in front of the asu server: LuCI attendedsysupgrade calls the
# API cross-origin from the router's web UI, asu itself sends no
# Access-Control-Allow-* headers (upstream runs behind a proxy too)
server {
    listen 8000;

    # custom rootfs uploads can be large (see max_custom_rootfs_size_mb)
    client_max_body_size 1024m;

    # `always`: asu replies 202/4xx/5xx on build requests, add_header
    # without it only covers 2xx/3xx success codes
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # custom-device metadata: clients (owut, LuCI) fetch upstream_url files
    # directly, so the compose-internal metadata server must be reachable
    # through this public port as well
    location /releases/ {
        proxy_pass http://metadata;
    }
    location = /.versions.json {
        proxy_pass http://metadata;
    }

    location / {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
