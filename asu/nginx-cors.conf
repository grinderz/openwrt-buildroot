# CORS proxy in front of the asu server: LuCI attendedsysupgrade calls the
# API cross-origin from the router's web UI, asu itself sends no
# Access-Control-Allow-* headers (upstream runs behind a proxy too)
server {
    listen 8000;

    # docker's embedded DNS + variable upstreams: nginx re-resolves the
    # names instead of caching the container IP at startup, so recreating
    # the server/metadata containers no longer leaves the proxy answering
    # 502 until its own restart
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $asu_server http://server:8000;
    set $asu_metadata http://metadata;

    # custom rootfs uploads can be large (see max_custom_rootfs_size_mb)
    client_max_body_size 1024m;

    # `always`: asu replies 202/4xx/5xx on build requests, add_header
    # without it only covers 2xx/3xx success codes
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # custom-device metadata: clients (owut, LuCI) fetch upstream_url files
    # directly, so the compose-internal metadata server must be reachable
    # through this public port as well
    # a variable proxy_pass without a URI part passes the original
    # request URI through unchanged
    location /releases/ {
        proxy_pass $asu_metadata;
    }
    location = /.versions.json {
        proxy_pass $asu_metadata;
    }

    location / {
        proxy_pass $asu_server;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
