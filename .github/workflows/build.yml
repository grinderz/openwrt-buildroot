name: Build

# Manual full cycle: src build of every selected target (one job each, in
# parallel), then img.src.profile.* for the profiles of that target in the
# same job, artifacts uploaded for local use (make ci.download RUN=<id>).
# Devices (imagebuilder/<ver>/devices) are not built here: their custom
# packages come from private hosts, build them locally from the artifacts
# (profiles with private repositories only get opkg/apk warnings).
on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'space-separated versions (versions/<name>.mk)'
        default: '24.10.8 25.12.6'
      targets:
        description: '"all" or space-separated target/subtarget pairs'
        default: 'all'
      images:
        description: 'build img.src.profile.* images after the src build'
        type: boolean
        default: true
      retention_days:
        description: 'artifact retention in days'
        default: '7'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.matrix.outputs.src }}
      img: ${{ steps.matrix.outputs.img }}
    steps:
      - uses: actions/checkout@v7

      - id: matrix
        run: |
          m=$(scripts/ci-matrix.sh "${{ inputs.versions }}" "${{ inputs.targets }}")
          echo "$m" | jq .
          echo "src=$(jq -c .src <<< "$m")" >> "$GITHUB_OUTPUT"
          echo "img=$(jq -c .img <<< "$m")" >> "$GITHUB_OUTPUT"

  # 4 vCPU, ~14 GB free on / (+25 GB after the cleanup below), 6 h limit:
  # a cold OpenWrt build fits one target per job
  src:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.src) }}
    name: src ${{ matrix.version }} ${{ matrix.target }}/${{ matrix.subtarget }}
    env:
      OWRT_RELEASE: ${{ matrix.version }}
      SRC_TARGET: ${{ matrix.target }}
      SRC_SUBTARGET: ${{ matrix.subtarget }}
    steps:
      - uses: actions/checkout@v7

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af > /dev/null
          df -h /

      - name: install host tools
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends zstd

      # artifacts/{src,img}/<CONFIG_DIR_VERSION>: equals the release for
      # patch releases, not for branch names (master-almond3s -> master)
      - id: vars
        run: |
          make -s info | awk -F': ' '$1 == "OWRT_DIR" {print "owrt_dir=" $2} $1 == "CONFIG_DIR_VERSION" {print "dir_version=" $2}' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: srcbuilder image
        run: make src.docker.build

      # compose forwards no host env: the selection goes in with -e (the
      # Makefile reads OWRT_RELEASE/SRC_TARGET/SRC_SUBTARGET from the
      # environment, local.mk does not exist on the runner)
      - name: src clone
        run: docker compose run --rm -T -w /builder/src -e OWRT_RELEASE -e SRC_TARGET -e SRC_SUBTARGET srcbuilder make src.clone

      # no caches: the runs are manual and rare, a GitHub cache expires after
      # 7 days unused, and dl/ (1.3 GB per version) downloads in minutes
      # CONFIG_BUILD_LOG=y: OpenWrt hides a failed package's output behind
      # "re-run with V=s", the per-package log files under <owrt_dir>/logs
      # keep it and are uploaded when the build fails
      - name: src build
        run: docker compose run --rm -T -w /builder/src -e OWRT_RELEASE -e SRC_TARGET -e SRC_SUBTARGET -e SRC_CONFIG_EXTRA=CONFIG_BUILD_LOG=y srcbuilder make src.all

      - name: upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs__${{ matrix.version }}__${{ matrix.target }}-${{ matrix.subtarget }}
          path: ${{ steps.vars.outputs.owrt_dir }}/logs
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: ignore

      # the src products are the expensive part: uploaded before the image
      # builds, so a failing profile does not cost the hours of the build
      - name: upload src artifacts
        uses: actions/upload-artifact@v7
        with:
          name: src__${{ matrix.version }}__${{ matrix.target }}-${{ matrix.subtarget }}
          path: artifacts/src/${{ steps.vars.outputs.dir_version }}/*
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error

      # every profile is attempted, the step fails at the end if any did
      - name: images
        if: ${{ inputs.images }}
        run: |
          profiles=$(jq -r --arg v "$OWRT_RELEASE" --arg t "$SRC_TARGET" --arg s "$SRC_SUBTARGET" \
            '.[] | select(.version == $v and .target == $t and .subtarget == $s) | .name' \
            <<< '${{ needs.matrix.outputs.img }}')
          failed=""
          for p in $profiles; do
            echo "::group::img.src.profile.$p"
            make img.src.profile."$p" || failed="$failed $p"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::image build failed for:$failed"
            exit 1
          fi

      - name: upload image artifacts
        if: ${{ inputs.images && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: img__${{ matrix.version }}__${{ matrix.target }}-${{ matrix.subtarget }}
          path: artifacts/img/${{ steps.vars.outputs.dir_version }}/*.tar.zst
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: ignore
